; Read by PHP-FPM / FastCGI (Heroku, most production hosts). Not read by `php artisan serve`.
; Must stay above the app's validation limits: 5 MB per image (several per pet) and
; 5 MB registration documents, otherwise uploads fail before Laravel sees them.
upload_max_filesize = 6M
post_max_size = 32M
max_file_uploads = 20
